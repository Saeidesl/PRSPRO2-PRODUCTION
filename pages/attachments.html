<section class="page-section">
  <div class="page-header">
    <div>
      <h2>فایل‌ها</h2>
      <p>فایل‌های هر پروژه را در فضای اختصاصی همان پروژه مشاهده کنید.</p>
    </div>
    <div class="page-header-actions">
      <button type="button" class="btn btn-primary" id="attachment-upload-button">+ بارگذاری فایل</button>
    </div>
  </div>
  <div class="card">
    <div class="card-body">
      <div class="filter-bar">
        <div class="filter-group" style="flex:1;min-width:220px">
          <label for="attachment-search">جستجوی پروژه</label>
          <input type="text" id="attachment-search" placeholder="نام یا کد پروژه...">
        </div>
      </div>
      <div id="attachments-loading" class="loading-state">در حال بارگذاری پروژه‌ها و فایل‌ها...</div>
      <div id="attachments-error" class="alert alert-danger" hidden></div>
      <div id="attachments-table-container" hidden></div>
      <div id="attachments-empty" class="table-empty" hidden>پروژه‌ای دارای فایل برای نمایش وجود ندارد.</div>
    </div>
  </div>
</section>
